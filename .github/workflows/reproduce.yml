name: Full numerical and Lean reproduction
on: workflow_dispatch
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/restore_certificates.py
      - run: python scripts/check_package.py
      - run: python -m pip install -r requirements.txt
      - name: Install Elan and pinned Lean
        shell: bash
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          bash /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat proof/lean/lean-toolchain)"
      - name: Clear historical execution evidence
        run: rm -f proof/lean/final_build.log proof/lean/final_axiom_audit.log proof/numerical/final29/verification.json proof/numerical/final29/numerical_rechecks.json proof/numerical/final29/build.exit proof/numerical/final29/audit.exit
      - name: Reproduce mathematical checks
        id: reproduce
        working-directory: proof
        run: bash numerical/final29/reproduce.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.reproduce.outcome != 'skipped'
        with:
          name: reproduction-evidence
          path: |
            proof/numerical/final29/verification.json
            proof/numerical/final29/numerical_rechecks.json
            proof/numerical/final29/*.exit
            proof/lean/final_build.log
            proof/lean/final_axiom_audit.log
